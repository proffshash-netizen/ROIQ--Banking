version: '3.8'

services:
  roiq-postgres:
    image: postgres:16-alpine
    container_name: roiq-banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roiq_user
      POSTGRES_PASSWORD: roiq_secure_password
      POSTGRES_DB: roiq_banking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roiq_user -d roiq_banking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
